name: Assemble Translation Keeper source

on:
  push:
    branches: [main]
    paths:
      - ".build/main.b64.*"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble main.js
        run: |
          cat .build/main.b64.* | base64 -d > scripts/main.js
          node --check scripts/main.js
      - name: Commit assembled source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/main.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: add protected three-way translation merge"
          git push
