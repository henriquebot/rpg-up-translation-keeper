name: Build installable module zip

on:
  push:
    branches: [main]
    paths:
      - "module.json"
      - "scripts/**"
      - "styles/**"
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - ".github/workflows/build-dist.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ZIP
        run: |
          rm -f dist/rpg-up-translation-keeper.zip
          zip -r dist/rpg-up-translation-keeper.zip module.json scripts styles README.md CHANGELOG.md LICENSE
          unzip -t dist/rpg-up-translation-keeper.zip
      - name: Commit ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/rpg-up-translation-keeper.zip
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: package Translation Keeper v0.2.0"
          git push
